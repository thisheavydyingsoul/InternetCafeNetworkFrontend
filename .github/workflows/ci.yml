name: Frontend CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    needs:
      - frontend-lint
      - frontend-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Angular configuration
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.ref_name }}" = "main" ]; then
            echo "BUILD_CONFIGURATION=production" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIGURATION=staging" >> "$GITHUB_ENV"
          fi

      - name: Build customer (${{ env.BUILD_CONFIGURATION }})
        run: npm run build:customer:${{ env.BUILD_CONFIGURATION }}

      - name: Build admin (${{ env.BUILD_CONFIGURATION }})
        run: npm run build:admin:${{ env.BUILD_CONFIGURATION }}

  frontend-docker-build:
    name: frontend-docker-build
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Angular configuration
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.ref_name }}" = "main" ]; then
            echo "BUILD_CONFIGURATION=production" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIGURATION=staging" >> "$GITHUB_ENV"
          fi

      - name: Build customer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/customer/Dockerfile
          push: false
          tags: internet-cafe-customer:ci
          build-args: |
            BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }}
            NG_APP_API_BASE_URL=http://localhost:8080/api

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin/Dockerfile
          push: false
          tags: internet-cafe-admin:ci
          build-args: |
            BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }}
            NG_APP_API_BASE_URL=http://localhost:8080/api

  frontend-security:
    name: frontend-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



