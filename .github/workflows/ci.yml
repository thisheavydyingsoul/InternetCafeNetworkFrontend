name: Frontend CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    needs:
      - frontend-lint
      - frontend-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Angular configuration
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.ref_name }}" = "main" ]; then
            echo "BUILD_CONFIGURATION=production" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIGURATION=staging" >> "$GITHUB_ENV"
          fi

      - name: Build customer (${{ env.BUILD_CONFIGURATION }})
        run: npm run build:customer:${{ env.BUILD_CONFIGURATION }}

      - name: Build admin (${{ env.BUILD_CONFIGURATION }})
        run: npm run build:admin:${{ env.BUILD_CONFIGURATION }}

  frontend-docker-build:
    name: frontend-docker-build
    runs-on: ubuntu-latest
    needs: frontend-build

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define immutable image tag
        id: meta
        shell: bash
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve Angular configuration
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "BUILD_CONFIGURATION=production" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "BUILD_CONFIGURATION=staging" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIGURATION=development" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build customer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/customer/Dockerfile
          push: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
          tags: ghcr.io/${{ github.repository_owner }}/internet-cafe-customer:${{ steps.meta.outputs.image_tag }}
          build-args: |
            BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }}

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin/Dockerfile
          push: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
          tags: ghcr.io/${{ github.repository_owner }}/internet-cafe-admin:${{ steps.meta.outputs.image_tag }}
          build-args: |
            BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }}

  frontend-security:
    name: frontend-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-deploy:
    name: frontend-deploy
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/head/dev' || github.ref == 'refs/heads/main')
    needs:
      - frontend-docker-build
      - frontend-security
      - frontend-build

    uses: ./.github/workflows/deploy.yml

    with:
      environment: ${{ github.ref_name == 'dev' && 'staging' || github.ref_name == 'main' && 'production' }}
      ref: ${{ github.ref_name }}
      image_tag: ${{ needs.frontend-docker-build.outputs.image_tag }}
      source_sha: ${{ github.sha }}

    secrets: inherit


