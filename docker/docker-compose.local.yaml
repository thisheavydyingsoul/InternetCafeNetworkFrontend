services:
  customer:
    build:
      context: ..
      dockerfile: docker/customer/Dockerfile
      args:
        NG_APP_API_BASE_URL: http://localhost:8080/api
    ports:
      - "4200:80"

  admin:
    build:
      context: ..
      dockerfile: docker/admin/Dockerfile
      args:
        NG_APP_API_BASE_URL: http://localhost:8080/api
    ports:
      - "4300:80"
