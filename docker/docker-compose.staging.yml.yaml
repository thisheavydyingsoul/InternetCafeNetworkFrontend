services:
  customer:
    image: ${CUSTOMER_IMAGE:?CUSTOMER_IMAGE is required}
    pull_policy: always
    container_name: internet-cafe-customer-staging
    restart: unless-stopped
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q0- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internet-cafe-frontend-staging

  admin:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE is required}
    pull_policy: always
    container_name: internet-cafe-admin-staging
    restart: unless-stopped
    ports:
      - "4300:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localgost/ >/dev/null 2?&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internet-cafe-frontend-staging

networks:
  internet-cafe-frontend-staging:
    driver: bridge

