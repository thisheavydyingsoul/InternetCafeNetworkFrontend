server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /main.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /polyfills.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /styles.css {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location ~ ^/chunk-[A-Za-z0-9_-]+\.js$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
